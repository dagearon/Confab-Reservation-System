<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Staff Registration | Library Confab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a6e;--navy-dark:#162d56;--navy-deeper:#0f2040;--navy-light:#2a4d8f;
  --off-white:#f0f3f9;--border:#d0d9ec;--text:#1a2a45;--text-soft:#5a6f8f;
  --text-faint:#9aaabf;--danger:#c0392b;--success:#2d7a4f;--gold:#f5c842;
}
html,body{min-height:100%}
body{font-family:'DM Sans',sans-serif;background:#dde4f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0}
body::before{content:'';position:fixed;top:-150px;right:-150px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,#b8c8e8 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-120px;left:-120px;width:450px;height:450px;border-radius:50%;background:radial-gradient(circle,#c4d0e8 0%,transparent 70%);pointer-events:none;z-index:0}
.card{display:flex;width:min(960px,96vw);background:#fff;border-radius:20px;box-shadow:0 4px 50px rgba(14,32,64,.18),0 0 0 1px rgba(14,32,64,.06);overflow:hidden;position:relative;z-index:1;animation:fadeUp .55s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.left{flex:1;background:linear-gradient(160deg,var(--navy-light) 0%,var(--navy) 50%,var(--navy-deeper) 100%);padding:3rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:480px}
.left::before{content:'';position:absolute;top:-70px;right:-70px;width:280px;height:280px;border-radius:50%;border:45px solid rgba(255,255,255,.06)}
.left::after{content:'';position:absolute;bottom:-90px;left:-50px;width:240px;height:240px;border-radius:50%;border:35px solid rgba(255,255,255,.04)}
.shield{width:110px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.tagline{position:relative;z-index:1}
.tagline h1{font-family:'DM Serif Display',serif;font-size:clamp(22px,2.6vw,32px);color:#fff;line-height:1.25;margin-bottom:.9rem}
.tagline h1 em{font-style:italic;color:#7eb3ff}
.tagline p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7}
.dots{display:flex;gap:8px}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots span.on{background:var(--gold);width:24px;border-radius:4px}
.right{width:460px;padding:2.8rem 3rem;display:flex;flex-direction:column;justify-content:center;background:#fff;overflow-y:auto}
.fhead{margin-bottom:1.2rem}
.fhead h2{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text);margin-bottom:4px}
.fhead p{font-size:13px;color:var(--text-soft)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;margin-bottom:1.1rem;font-size:13px;font-weight:500;background:rgba(245,200,66,0.12);color:#7a5c00;border:1px solid rgba(245,200,66,0.3)}
.banner svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.alert{display:none;font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:.9rem;border-left:3px solid}
.alert.error{background:#fdf2f2;color:var(--danger);border-color:var(--danger)}
.alert.success{background:#f0f9f4;color:var(--success);border-color:var(--success)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text-soft);margin-bottom:5px}
.field .wrap{position:relative}
.field input{width:100%;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);background:var(--off-white);border:1.5px solid transparent;border-radius:10px;outline:none;transition:border-color .2s,background .2s}
.field input::placeholder{color:var(--text-faint)}
.field input:focus{background:#fff;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,110,.1)}
.field input.pw{padding-right:42px}
.eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-faint);display:flex;align-items:center;padding:2px;transition:color .2s}
.eye:hover{color:var(--text-soft)}
.btn{width:100%;padding:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:#fff;background:var(--navy);border:none;border-radius:10px;cursor:pointer;letter-spacing:.02em;transition:background .2s,transform .15s;margin-top:.25rem}
.btn:hover{background:var(--navy-dark)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.links{text-align:center;font-size:13px;color:var(--text-soft);margin-top:.9rem}
.links a{color:var(--navy);font-weight:500;text-decoration:none}
.links a:hover{text-decoration:underline}
.links .sep{margin:0 6px;color:var(--text-faint)}
@media(max-width:680px){.left{display:none}.right{width:100%;padding:2rem 1.5rem}}
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <svg class="shield" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 4L112 28L112 80Q112 120 60 136Q8 120 8 80L8 28Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <path d="M60 12L104 34L104 80Q104 115 60 128Q16 115 16 80L16 34Z" fill="rgba(255,255,255,0.07)"/>
      <text x="60" y="82" text-anchor="middle" font-family="DM Serif Display,serif" font-size="28" fill="rgba(255,255,255,0.9)" font-style="italic">XU</text>
      <text x="60" y="100" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="7" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">ATENEO DE CAGAYAN</text>
    </svg>
    <div class="tagline">
      <h1>Staff<br/>Access<br/><em>Portal.</em></h1>
      <p>Register your library staff account<br/>to manage reservations.</p>
    </div>
    <div class="dots"><span class="on"></span><span></span><span></span></div>
  </div>
  <div class="right">
    <div class="fhead">
      <h2>Staff Registration</h2>
      <p>Create your staff account to manage confab reservations</p>
    </div>
    <div class="banner">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Library Staff Account
    </div>
    <div class="alert error" id="err"></div>
    <div class="alert success" id="suc"></div>
    <div class="row2">
      <div class="field"><label>First Name</label><input type="text" id="fname" placeholder="Maria" autocomplete="given-name"/></div>
      <div class="field"><label>Last Name</label><input type="text" id="lname" placeholder="Santos" autocomplete="family-name"/></div>
    </div>
    <div class="field"><label>Staff / Employee ID</label><input type="text" id="sid" placeholder="e.g. STAFF-001"/></div>
    <div class="field"><label>Email Address</label><input type="email" id="email" placeholder="e.g. msantos@xu.edu.ph" autocomplete="email"/></div>
    <div class="row2">
      <div class="field">
        <label>Password</label>
        <div class="wrap">
          <input type="password" id="pw" class="pw" placeholder="Min. 6 chars" autocomplete="new-password"/>
          <button class="eye" type="button" onclick="toggleEye('pw','ico1')">
            <svg id="ico1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="17" height="17"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <div class="wrap">
          <input type="password" id="cpw" class="pw" placeholder="Repeat" autocomplete="new-password"/>
          <button class="eye" type="button" onclick="toggleEye('cpw','ico2')">
            <svg id="ico2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="17" height="17"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </div>
    <button class="btn" id="reg-btn" onclick="doRegister()">Create Staff Account</button>
    <div class="links">
      Already have an account? <a href="LogIn.html">Sign in</a>
      <span class="sep">|</span>
      Student? <a href="Register.html">Register as Student</a>
    </div>
  </div>
</div>
<script>
function toggleEye(inputId, iconId) {
  var inp = document.getElementById(inputId);
  var ico = document.getElementById(iconId);
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    ico.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
function showAlert(type, msg) {
  document.getElementById('err').style.display = 'none';
  document.getElementById('suc').style.display = 'none';
  var el = document.getElementById(type === 'error' ? 'err' : 'suc');
  el.textContent = msg;
  el.style.display = 'block';
}
function doRegister() {
  var fname = document.getElementById('fname').value.trim();
  var lname = document.getElementById('lname').value.trim();
  var sid   = document.getElementById('sid').value.trim();
  var email = document.getElementById('email').value.trim();
  var pw    = document.getElementById('pw').value;
  var cpw   = document.getElementById('cpw').value;
  var btn   = document.getElementById('reg-btn');
  if (!fname || !lname) return showAlert('error', 'Please enter your full name.');
  if (!sid)   return showAlert('error', 'Please enter your Staff/Employee ID.');
  if (!email) return showAlert('error', 'Please enter your email address.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('error', 'Please enter a valid email address.');
  if (!pw || pw.length < 6) return showAlert('error', 'Password must be at least 6 characters.');
  if (pw !== cpw) return showAlert('error', 'Passwords do not match.');
  var users = JSON.parse(localStorage.getItem('xu_users') || '[]');
  if (users.some(function(u){ return u.email === email; })) return showAlert('error', 'An account with this email already exists.');
  btn.textContent = 'Creating account…';
  btn.disabled = true;
  setTimeout(function() {
    users.push({ fname:fname, lname:lname, sid:sid, email:email, password:pw, type:'staff', createdAt:new Date().toISOString() });
    localStorage.setItem('xu_users', JSON.stringify(users));
    btn.textContent = 'Create Staff Account';
    btn.disabled = false;
    showAlert('success', 'Staff account created! Redirecting to sign in…');
    setTimeout(function(){ window.location.href = 'LogIn.html'; }, 1500);
  }, 900);
}
document.addEventListener('keydown', function(e){ if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
