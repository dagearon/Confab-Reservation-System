<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | LibReserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7f6; }
        .nav-admin { background: #1a1d23; padding: 10px 5%; }
        .card-req { background: white; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark nav-admin">
        <a class="navbar-brand fw-bold" href="#">LibReserve Admin</a>
        <a href="/logout" class="btn btn-outline-warning btn-sm">Logout (Staff)</a>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8">
                <h4 class="fw-bold mb-4">Pending Requests</h4>
                <% pending.forEach(req => { %>
                    <div class="card-req p-4 shadow-sm">
                        <div class="d-flex justify-content-between border-bottom pb-2 mb-3">
                            <span>ID: <b><%= req.trackingCode %></b></span>
                            <span>Room: <b><%= req.roomName %></b></span>
                        </div>
                        <h5><%= req.studentName %></h5>
                        <p class="small"><%= req.date %> | <%= req.startTime %> - <%= req.endTime %></p>
                        <div class="d-flex gap-2">
                            <form action="/admin/status" method="POST" class="flex-grow-1">
                                <input type="hidden" name="id" value="<%= req.id %>">
                                <input type="hidden" name="status" value="approved">
                                <button type="submit" class="btn btn-success w-100 fw-bold">Approve</button>
                            </form>
                            <form action="/admin/status" method="POST" class="flex-grow-1">
                                <input type="hidden" name="id" value="<%= req.id %>">
                                <input type="hidden" name="status" value="rejected">
                                <button type="submit" class="btn btn-danger w-100 fw-bold">Reject</button>
                            </form>
                        </div>
                    </div>
                <% }) %>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm mb-4">
                    <h6 class="text-danger fw-bold">Conflict Alerts!</h6>
                    <div class="alert alert-warning small p-2 mt-2">Manual check required for time overlaps.</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
